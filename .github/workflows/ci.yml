name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    # Placeholder values so `prisma generate` (postinstall) and the Auth.js build
    # step have the env vars they read. CI never connects to a real database.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/collabdoc"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/collabdoc"
      AUTH_SECRET: "ci-throwaway-secret-not-used-anywhere"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
