<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CollabDoc — UI screenshots</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0d0d0e;
        --muted: #6b6b70;
        --border: #e4e7ee;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090a;
          --fg: #ededee;
          --muted: #9b9ba3;
          --border: #242428;
          --card: #111113;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 24px 96px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .lede {
        margin: 0 0 40px;
        color: var(--muted);
        font-size: 15px;
      }
      h2 {
        margin: 48px 0 16px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 20px;
      }
      .grid.narrow {
        grid-template-columns: repeat(auto-fill, minmax(220px, 280px));
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
      }
      figure a {
        display: block;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border-bottom: 1px solid var(--border);
      }
      figcaption {
        padding: 12px 14px;
        font-size: 13px;
      }
      figcaption span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CollabDoc — UI screenshots</h1>
      <p class="lede">Captured from the production build at 1440×900 (mobile at 390×844). Click any image to open it full size.</p>

      <h2>Landing page</h2>
      <div class="grid">
        <figure><a href="01-landing-hero.png"><img src="01-landing-hero.png" alt="Hero" loading="lazy" /></a><figcaption>Hero<span>Headline with a live cursor, and the top of the sync demo</span></figcaption></figure>
        <figure><a href="02-landing-sync-demo.png"><img src="02-landing-sync-demo.png" alt="Playable sync demo" loading="lazy" /></a><figcaption>Playable sync demo<span>Two devices, one goes offline, both keep editing, then merge</span></figcaption></figure>
        <figure><a href="03-landing-why.png"><img src="03-landing-why.png" alt="Why CollabDoc" loading="lazy" /></a><figcaption>Why CollabDoc<span>A typical online editor versus CollabDoc, shown as a diff</span></figcaption></figure>
        <figure><a href="04-landing-features.png"><img src="04-landing-features.png" alt="Features" loading="lazy" /></a><figcaption>Features<span>Four core ideas, each with its own visual</span></figcaption></figure>
        <figure><a href="04b-landing-features-sync.png"><img src="04b-landing-features-sync.png" alt="Features — real-time sync" loading="lazy" /></a><figcaption>Features — real-time sync<span>The merge illustration</span></figcaption></figure>
        <figure><a href="05-landing-workspace.png"><img src="05-landing-workspace.png" alt="Workspace" loading="lazy" /></a><figcaption>Workspace<span>The dashboard, in a browser frame</span></figcaption></figure>
        <figure><a href="06-landing-ai.png"><img src="06-landing-ai.png" alt="AI assistant" loading="lazy" /></a><figcaption>AI assistant<span>Grounded answers, permission-scoped</span></figcaption></figure>
        <figure><a href="07-landing-security.png"><img src="07-landing-security.png" alt="Security" loading="lazy" /></a><figcaption>Security<span>Three enforcement layers and key numbers</span></figcaption></figure>
        <figure><a href="08-landing-more.png"><img src="08-landing-more.png" alt="More features" loading="lazy" /></a><figcaption>More features</figcaption></figure>
        <figure><a href="09-landing-cta-footer.png"><img src="09-landing-cta-footer.png" alt="Final call to action and footer" loading="lazy" /></a><figcaption>Final call to action and footer<span>Author links: GitHub and LinkedIn</span></figcaption></figure>
        <figure><a href="10-landing-dark.png"><img src="10-landing-dark.png" alt="Hero — dark mode" loading="lazy" /></a><figcaption>Hero — dark mode</figcaption></figure>
        <figure><a href="11-landing-dark-features.png"><img src="11-landing-dark-features.png" alt="Features — dark mode" loading="lazy" /></a><figcaption>Features — dark mode</figcaption></figure>
      </div>

      <h2>Sign in and public pages</h2>
      <div class="grid">
        <figure><a href="12-sign-in.png"><img src="12-sign-in.png" alt="Sign in" loading="lazy" /></a><figcaption>Sign in<span>Form with the merge illustration panel</span></figcaption></figure>
        <figure><a href="13-sign-up.png"><img src="13-sign-up.png" alt="Create account" loading="lazy" /></a><figcaption>Create account</figcaption></figure>
        <figure><a href="14-sync-lab.png"><img src="14-sync-lab.png" alt="Sync lab" loading="lazy" /></a><figcaption>Sync lab<span>Two real editors merging, no account needed</span></figcaption></figure>
        <figure><a href="15-not-found.png"><img src="15-not-found.png" alt="404 page" loading="lazy" /></a><figcaption>404 page</figcaption></figure>
      </div>

      <h2>Workspace</h2>
      <div class="grid">
        <figure><a href="18-dashboard.png"><img src="18-dashboard.png" alt="Dashboard — table view" loading="lazy" /></a><figcaption>Dashboard — table view<span>Stats, views, folders and the documents table</span></figcaption></figure>
        <figure><a href="19-dashboard-grid-view.png"><img src="19-dashboard-grid-view.png" alt="Dashboard — grid view" loading="lazy" /></a><figcaption>Dashboard — grid view</figcaption></figure>
        <figure><a href="26-dashboard-dark.png"><img src="26-dashboard-dark.png" alt="Dashboard — dark mode" loading="lazy" /></a><figcaption>Dashboard — dark mode</figcaption></figure>
        <figure><a href="24-search-and-ask.png"><img src="24-search-and-ask.png" alt="Search &amp; Ask" loading="lazy" /></a><figcaption>Search &amp; Ask</figcaption></figure>
        <figure><a href="25-settings.png"><img src="25-settings.png" alt="Settings" loading="lazy" /></a><figcaption>Settings</figcaption></figure>
      </div>

      <h2>Editor</h2>
      <div class="grid">
        <figure><a href="20-editor.png"><img src="20-editor.png" alt="Editor" loading="lazy" /></a><figcaption>Editor<span>Title, tags, sync status, toolbar and writing canvas</span></figcaption></figure>
        <figure><a href="21-editor-ai-panel.png"><img src="21-editor-ai-panel.png" alt="Editor — AI assistant panel" loading="lazy" /></a><figcaption>Editor — AI assistant panel</figcaption></figure>
        <figure><a href="22-editor-version-history.png"><img src="22-editor-version-history.png" alt="Editor — version history panel" loading="lazy" /></a><figcaption>Editor — version history panel</figcaption></figure>
        <figure><a href="23-editor-dark.png"><img src="23-editor-dark.png" alt="Editor — dark mode" loading="lazy" /></a><figcaption>Editor — dark mode</figcaption></figure>
      </div>

      <h2>Mobile</h2>
      <div class="grid narrow">
        <figure><a href="16-landing-mobile.png"><img src="16-landing-mobile.png" alt="Landing" loading="lazy" /></a><figcaption>Landing</figcaption></figure>
        <figure><a href="17-sign-in-mobile.png"><img src="17-sign-in-mobile.png" alt="Sign in" loading="lazy" /></a><figcaption>Sign in</figcaption></figure>
        <figure><a href="27-dashboard-mobile.png"><img src="27-dashboard-mobile.png" alt="Dashboard" loading="lazy" /></a><figcaption>Dashboard</figcaption></figure>
      </div>
    </main>
  </body>
</html>
